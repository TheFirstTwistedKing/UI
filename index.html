<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="웹 홈페이지 UI를 직접 배치하고 꾸미는 비주얼 에디터">
<title>UI Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;700&family=Inter:wght@300;400;500;600;700;900&family=Montserrat:wght@300;400;500;600;700;900&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="css/editor.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><b>UI FORGE</b><span>Web</span></div>
    <input class="proj" id="projName" type="text" aria-label="프로젝트 이름">
    <div class="grp"><span class="lbl">화면 폭</span>
      <select class="sel" id="device" aria-label="화면 폭">
        <option value="1440">데스크톱 1440</option>
        <option value="1024">태블릿 가로 1024</option>
        <option value="768">태블릿 768</option>
        <option value="390">모바일 390</option>
      </select>
    </div>
    <div class="grp"><span class="lbl">확대</span>
      <select class="sel" id="zoom" aria-label="확대">
        <option value="fit">맞춤</option><option value="0.5">50%</option><option value="0.75">75%</option><option value="1">100%</option>
      </select>
    </div>
    <label class="grp" style="cursor:pointer"><input type="checkbox" id="snap" style="accent-color:var(--accent)"><span class="lbl">스냅</span></label>
    <div class="grp">
      <button class="btn" id="undo" type="button" title="Ctrl+Z">되돌리기</button>
      <button class="btn" id="redo" type="button" title="Ctrl+Shift+Z">다시</button>
    </div>
    <div class="spacer"></div>
    <div class="grp">
      <button class="btn" id="newBtn" type="button">새로 만들기</button>
      <button class="btn" id="saveBtn" type="button">저장</button>
      <button class="btn" id="loadBtn" type="button">불러오기</button>
      <button class="btn" id="previewBtn" type="button" title="내보낸 HTML을 새 탭에서 열기">미리보기</button>
      <button class="btn primary" id="exportBtn" type="button">내보내기</button>
    </div>
  </header>

  <aside class="left">
    <div class="ph">삽입</div>
    <div class="insert" id="insert"></div>
    <div class="hint" id="insHint"></div>
    <div class="ph">레이어 <small id="count"></small></div>
    <div class="tree" id="tree"></div>
    <div class="treebar">
      <button class="btn" id="upBtn" type="button" title="목록에서 위로 (뒤로 보내기)">▲</button>
      <button class="btn" id="downBtn" type="button" title="목록에서 아래로 (앞으로 가져오기)">▼</button>
      <button class="btn" id="dupBtn" type="button" title="Ctrl+D">복제</button>
      <button class="btn danger" id="delBtn" type="button" title="Delete">삭제</button>
      <button class="btn" id="multiTap" type="button" title="켜면 누르는 요소가 선택에 추가됩니다 (휴대폰용)" aria-pressed="false">다중</button>
    </div>
  </aside>

  <main class="stage" id="stage">
    <div class="shot" id="shot"><div class="screen" id="screen"></div></div>
  </main>

  <aside class="right" id="props"></aside>

  <footer class="status" id="status"></footer>
</div>

<div class="modal" id="codeModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="codeTitle">
    <header><h2 id="codeTitle">내보내기</h2>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="html">HTML</button>
        <button type="button" role="tab" data-tab="css">CSS</button>
        <button type="button" role="tab" data-tab="json">프로젝트 JSON</button>
      </div>
      <div class="spacer"></div>
      <button class="btn" type="button" data-close>닫기</button>
    </header>
    <div class="body">
      <p class="note" id="codeNote" style="padding:0 0 10px"></p>
      <pre class="code" id="codeOut" tabindex="0"></pre>
      <div class="foot">
        <button class="btn primary" id="copyCode" type="button">복사</button>
        <button class="btn" id="downloadFile" type="button">파일로 저장</button>
      </div>
    </div>
  </div>
</div>

<div class="modal" id="loadModal" hidden>
  <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="loadTitle">
    <header><h2 id="loadTitle">불러오기</h2><div class="spacer"></div><button class="btn" type="button" data-close>닫기</button></header>
    <div class="body">
      <h4 style="margin-top:0">이 브라우저에 저장된 프로젝트</h4>
      <div class="slots" id="slots"></div>
      <h4>JSON 가져오기</h4>
      <textarea id="importText" placeholder="내보내기에서 복사한 내용을 붙여넣으세요"></textarea>
      <div class="foot">
        <button class="btn primary" id="importBtn" type="button">붙여넣은 JSON 열기</button>
        <label class="btn" for="importFile">JSON 파일 선택</label>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <button class="btn" id="sampleBtn" type="button">예시 히어로 섹션 열기</button>
        <span class="note" id="importMsg" style="padding:0"></span>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
